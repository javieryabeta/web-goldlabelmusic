<style>
/* ============================================================
   CSS GLOBAL — GOLD LABEL MUSIC — SUBPÁGINA BOOKING
   Orden: Variables, Base, Loader, Banner, Tabs, Secciones, Footer
============================================================ */

/* ===== VARIABLES ===== */
:root {
  --gold:#f7b500;
  --blue:#5794ff;
  --bg1:#0b1630;
  --bg2:#071227;
  --text:#ffffff;
  --muted:#9aa3b8;
  --accent:#f7b500;
  --accent-light:#ffd84d;

  /* altura de la barra de tabs fija (ajusta si cambias padding) */
  --tabs-height:72px;
}

/* ===== BASE ===== */
html,body {
  margin:0;
  padding:0;
  background:var(--bg2);   /* ← corregido: antes #000 */
  overflow-x:hidden;
}
body {
  font-family:"Inter",system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  color:var(--text);
  background-color:var(--bg2);  /* ← corregido: antes #000 */
}

/* ============================================================
   LOADER CINEMATOGRÁFICO — "Preparando la experiencia…"
============================================================ */
#loader {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-color: #111;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  z-index: 99999;
  transition: opacity 0.6s ease;
}

.spinner {
  width: 50px;
  height: 50px;
  border: 4px solid rgba(255, 215, 0, 0.3);
  border-top-color: #ffd700;
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin-bottom: 20px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loader-text {
  color: #ffd700;
  font-size: 1.2em;
  font-weight: 500;
  font-family: 'Arial', sans-serif;
}

/* ============================================================
   VIDEO BANNER ÚNICO (para TODAS las secciones)
============================================================ */
.video-banner{
  width:100vw;
  max-width:100vw;
  margin:0;
  border-radius:0;
  overflow:hidden;
  display:block;
  position:relative;
  top:0;
  margin-top:var(--tabs-height);
  background-color:#000;
  -webkit-font-smoothing:antialiased;
  -moz-osx-font-smoothing:grayscale;
}

.video-banner video{
  width:100%;
  height:auto;
  display:block;
  aspect-ratio:16/9;
  object-fit:cover;
  line-height:0;
  vertical-align:top;
}

.video-banner::after{
  content:"";
  position:absolute;
  bottom:0;
  left:0;
  width:100%;
  height:60%;
  background:linear-gradient(
    to bottom,
    rgba(11,22,48,0) 0%,
    rgba(11,22,48,0.6) 50%,
    rgba(7,18,39,0.9) 85%,
    #071227 100%
  );
  pointer-events:none;
}

/* ============================================================
   OCULTAR VIDEO-BANNER EN PÁGINAS LEGALES
   (Privacidad y Cookies)
============================================================ */
body.legal-mode #videoBanner {
  display: none !important;
}

/* ============================================================
   CONTENEDOR PRINCIPAL
============================================================ */
#app-container{
  max-width:1200px;
  margin:0 auto;
  padding:0 20px 20px;
  background:linear-gradient(180deg,var(--bg1),var(--bg2) 70%);
  border-radius:16px;
}

/* ============================================================
   MODO CINE PARA ESCRITORIO — MÁS ALTURA
============================================================ */
@media (min-width: 1025px) {
  .video-banner {
    max-height: 55vh !important;   /* ⭐ más altura */
    overflow: hidden;
  }

  .video-banner video {
    height: 55vh !important;        /* ⭐ más altura */
    width: 100%;
    object-fit: cover;
  }
}

/* ============================================================
   MODO CINE — RESPETA PARTE SUPERIOR + RECORTE SUAVE
============================================================ */
@media (min-width: 1025px) {
  .video-banner video {
    object-position: top -10%;   /* ⭐ respeta arriba + recorte suave */
  }
}

/* ============================================================
   TABS PRINCIPALES
============================================================ */

.tabs{
  position:fixed;
  top:0;
  left:0;
  right:0;
  z-index:10000;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:10px;
  margin:0;
  height:var(--tabs-height);
  padding:12px 10px;
  background:#0a0a0a;
  border-bottom:none;
  flex-wrap:nowrap;
  overflow-x:auto;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
  box-shadow:0 4px 18px rgba(0,0,0,0.35);
}
.tabs::-webkit-scrollbar{display:none;}

.tab{
  flex:0 0 auto;
  padding:10px 22px;
  background:rgba(255,255,255,0.07);
  border-radius:30px;
  border:1px solid rgba(255,255,255,0.12);
  cursor:pointer;
  display:flex;
  align-items:center;
  gap:8px;
  font-size:14px;
  color:#cdd3e1;
  transition:background .25s ease, box-shadow .25s ease, border-color .25s ease;
}

.tab i{
  color:var(--blue);
  font-size:16px;
}

.tab:hover{
  background:rgba(255,255,255,0.15);
  border-color:rgba(255,255,255,0.25);
  box-shadow:0 6px 14px rgba(0,0,0,0.18);
}

.tab.active{
  background:var(--gold);
  color:#0b1630;
  font-weight:600;
  border-color:rgba(0,0,0,0.12);
  box-shadow:0 8px 18px rgba(0,0,0,0.22);
}

.tab.active i{
  color:#0b1630;
}

/* ===== RESPONSIVE TABS ===== */
@media(max-width:768px){
  .tabs{
    justify-content:flex-start;
  }
}

@media(max-width:480px){
  :root { --tabs-height:64px; }
  .tabs{
    height:var(--tabs-height);
    padding:10px 8px;
  }
  .tab{
    padding:8px 16px;
    font-size:12px;
  }
  .tab i{
    font-size:14px;
  }
  .video-banner{ margin-top:var(--tabs-height); }
}

/* ============================================================
   SECCIONES GENERALES
============================================================ */

.section{
  display:none;
  animation:fadeIn 0.6s ease;
  padding-top:10px;
}
.section.active{
  display:block;
}

@keyframes fadeIn{
  from{opacity:0;transform:translateY(10px);}
  to{opacity:1;transform:translateY(0);}
}

/* ============================================================
   FOOTER — INTEGRADO CON EL GRADIENTE
============================================================ */
.footer {
  background: var(--bg2);
}

/* ============================================================
   HEADER PRINCIPAL — Visible solo en modo legal
============================================================ */

#main-header {
  display: none; /* oculto por defecto */
  width: 100%;
  padding: 30px 0 10px;
  text-align: center;
  background: var(--bg1);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

#main-header .header-logo {
  width: 180px;
  max-width: 70%;
  height: auto;
  display: block;
  margin: 0 auto;
  filter: drop-shadow(0 0 6px rgba(0,0,0,0.4));
}

/* Mostrar header cuando el body está en modo legal */
body.legal-mode #main-header {
  display: block !important;
}

/* ============================================================
   SECCIÓN BIOGRAFÍA
============================================================ */

.biografia-wrap{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
  text-align:left;
}

.biografia-title{
  font-size:26px;
  color:var(--gold);
  margin-bottom:10px;
}

.biografia-text{
  font-size:16px;
  line-height:1.7;
  color:var(--text);
  margin-bottom:20px;
}

.biografia-photo{
  width:100%;
  max-width:100%;
  height:auto;
  display:block;
  border-radius:0;
  margin:0 0 30px 0;
  box-shadow:none;
}

/* ============================================================
   BOTONES BIOGRAFÍA + ICONOS
============================================================ */

.bio-buttons {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 16px;
  margin-top: 30px;
  flex-wrap: wrap;
}

.btn-bio {
  background: #111;
  color: #fff;
  padding: 12px 22px;
  border-radius: 6px;
  border: 1px solid #444;
  cursor: pointer;
  font-size: 15px;
  transition: 0.25s ease;
  text-decoration: none;
  display: inline-flex;
  align-items: center;
  gap: 8px;
}

.btn-bio:hover,
.btn-bio:focus {
  background: #222;
  box-shadow: 0 0 8px rgba(255,255,255,0.15);
}

.btn-icon {
  width: 18px;
  height: 18px;
  flex-shrink: 0;
}

/* ============================================================
   MODAL RIDER — CORREGIDO + AJUSTE DE TAMAÑO MÁXIMO
============================================================ */

.rider-modal {
  display: none;
  position: fixed;
  z-index: 9999;
  inset: 0;
  background: rgba(0,0,0,0.75);
  backdrop-filter: blur(4px);
  justify-content: center;
  align-items: flex-start;
  padding: 80px 20px 20px;
  overflow-y: auto;
}

.rider-modal-content {
  position: relative;
  max-width: 500px;
  width: 100%;
  background: #000;
  padding: 15px;
  border-radius: 10px;
  box-shadow: 0 0 15px rgba(255,255,255,0.15);
}

.rider-img {
  width: 100%;
  height: auto;
  max-height: calc(100vh - 160px);
  object-fit: contain;
  border-radius: 8px;
}

.rider-close {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 34px;
  font-weight: 700;
  color: var(--gold);
  cursor: pointer;
  transition: 0.2s;
  text-shadow: 0 0 6px rgba(0,0,0,0.6);
}

.rider-close:hover {
  color: #fff;
}

/* ============================================================
   RESPONSIVE — FIX PARA QUE NO SE CORTEN Y SIGAN EN FILA
============================================================ */

@media (max-width: 420px) {
  .bio-buttons {
    flex-direction: row !important;
    flex-wrap: wrap !important;
    justify-content: center !important;
    align-items: center !important;
    gap: 8px !important;
  }

  .btn-bio {
    flex-shrink: 1 !important;
    white-space: nowrap !important;
    padding: 10px 14px !important;
    font-size: 14px !important;
  }
}

/* ============================================================
   OVERLAY PREMIUM "DESCARGANDO…" (CENTRADO)
============================================================ */

#download-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0,0,0,0.65);
  display: flex;
  justify-content: center;
  align-items: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .35s ease;
  z-index: 999999;
}

#download-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

#download-box {
  background: #111;
  padding: 25px 35px;
  border-radius: 12px;
  text-align: center;
  color: white;
  font-size: 18px;
  font-weight: 500;
  box-shadow: 0 0 25px rgba(0,0,0,0.4);
  animation: popIn .35s ease;
}

@keyframes popIn {
  0% { transform: scale(.7); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.spinner {
  margin: 15px auto 0;
  width: 32px;
  height: 32px;
  border: 4px solid #fff;
  border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

/* ============================================================
   MODAL GALERÍA — FONDO OSCURO + BLUR + ANIMACIÓN
============================================================ */

.galeria-modal{
  display:none;
  position:fixed !important; /* FIX: asegurar que no se mueve */
  inset:0;
  z-index:9999;
  background:rgba(0,0,0,0.75);
  backdrop-filter:blur(4px);
  justify-content:center;
  align-items:center;
  padding:40px 20px;
  overflow: hidden !important; /* FIX: evitar scroll interno */
  animation:fadeIn 0.35s ease;
}

@keyframes fadeIn{
  from{opacity:0;}
  to{opacity:1;}
}

.galeria-modal-content{
  position:relative;
  max-width:900px;
  width:100%;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* Imagen principal del modal */
.galeria-modal-img {
  width: 100%;
  height: auto;
  max-height: calc(100vh - 160px);
  object-fit: contain;
  border-radius: 10px;
  position: relative;
  z-index: 1;
  box-shadow:0 0 20px rgba(0,0,0,0.5);
}

/* X DE CIERRE */
.galeria-close{
  position:absolute;
  top:-10px;
  right:-10px;
  font-size:40px;
  font-weight:700;
  color:var(--gold);
  cursor:pointer;
  text-shadow:0 0 6px rgba(0,0,0,0.6);
  transition:0.2s;
  z-index:3; /* por encima de la imagen fantasma */
}

.galeria-close:hover{
  color:#fff;
}

/* FLECHAS */
.galeria-arrow{
  position:absolute;
  top:50%;
  transform:translateY(-50%);
  font-size:48px;
  font-weight:700;
  color:var(--gold);
  cursor:pointer;
  padding:10px;
  text-shadow:0 0 6px rgba(0,0,0,0.6);
  transition:0.2s;
  user-select:none;
  z-index:3; /* por encima de la imagen fantasma */
}

.galeria-arrow:hover{
  color:#fff;
}

.galeria-arrow.left{
  left:-50px;
}

.galeria-arrow.right{
  right:-50px;
}

/* MÓVIL: flechas visibles y accesibles */
@media (max-width:600px){

  .galeria-arrow{
    font-size:38px;
    padding:5px;
    top:50%;
    transform:translateY(-50%);
    z-index:5; /* asegurar que quedan por encima */
  }

  .galeria-arrow.left{
    left:0;
  }

  .galeria-arrow.right{
    right:0;
  }
}

/* ============================================================
   GALERÍA — CROSSFADE + MICRO‑ZOOM (A2)
============================================================ */

/* Imagen fantasma superpuesta */
.galeria-ghost {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: auto;
  max-height: calc(100vh - 160px);
  object-fit: contain;
  border-radius: 10px;
  opacity: 0;
  transform: scale(1.03);
  transition: opacity 0.45s ease, transform 0.45s ease;
  z-index: 2;
}

/* ============================================================
   GALERÍA — GRID RESPONSIVE (3 columnas / 2 columnas móvil)
============================================================ */

.galeria-wrap {
  max-width: 900px;
  margin: 40px auto;
  padding: 0 20px;
  text-align: left;
}

.galeria-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-top: 25px;
}

/* 🔥 CONTENEDOR SIEMPRE 16:9 (horizontal en todas las pantallas) */
.galeria-item {
  width: 100%;
  aspect-ratio: 16 / 9; /* Mantiene proporción horizontal SIEMPRE */
  overflow: hidden;
  border-radius: 10px;
  box-shadow: 0 4px 14px rgba(0,0,0,0.35);
}

/* 🔥 La imagen rellena el 16:9 sin deformarse */
.galeria-item img {
  width: 100%;
  height: 100%;
  object-fit: cover; /* Rellena sin deformar */
  display: block;
  transition: transform .35s ease;
}

.galeria-item:hover img {
  transform: scale(1.05);
}

/* MÓVIL — 2 columnas */
@media (max-width: 700px) {
  .galeria-grid {
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
}

/* ============================================================
   SECCIÓN VÍDEOS — VIDEO PRINCIPAL + GRID + MODAL
============================================================ */

.videos-wrap{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

/* Títulos */
.biografia-subtitle{
  font-size:20px;
  margin-top:10px;
  margin-bottom:10px;
  font-weight:600;
  color:#e0c27b; /* dorado suave */
}

/* ============================================================
   VIDEO PRINCIPAL — MINIATURA RESTAURADA
============================================================ */

.video-principal{
  position:relative;
  width:100%;
  aspect-ratio:16/9;
  border-radius:12px;
  overflow:hidden;
  margin-bottom:30px;
  box-shadow:0 4px 14px rgba(0,0,0,0.4);
  cursor:pointer;
}

.video-principal .video-thumb{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ============================================================
   GRID DE MINIATURAS SECUNDARIAS
============================================================ */

.videos-grid{
  display:grid;
  grid-template-columns:repeat(auto-fill, minmax(260px, 1fr));
  gap:16px;
}

.video-item{
  position:relative;
  width:100%;
  padding-top:56.25%;
  border-radius:12px;
  overflow:hidden;
  cursor:pointer;
  background:#000;
  box-shadow:0 4px 14px rgba(0,0,0,0.4);
}

.video-item img{
  position:absolute;
  top:0;
  left:0;
  width:100%;
  height:100%;
  object-fit:cover;
}

/* ============================================================
   ICONO PLAY — ANIMACIÓN FLUIDA SIN SALTOS
============================================================ */

.play-icon{
  position:absolute;
  top:10px;
  left:calc(100% - 38px); /* esquina superior derecha */
  width:28px;
  height:28px;
  border-radius:50%;
  background:rgba(255,255,255,0.45);
  display:flex;
  align-items:center;
  justify-content:center;
  transition:all 0.35s ease;
  transform:translate(0,0) scale(1);
  z-index:3;
  pointer-events:none; /* icono clicable a través */
}

.play-icon::before{
  content:"";
  width:0;
  height:0;
  border-top:6px solid transparent;
  border-bottom:6px solid transparent;
  border-left:10px solid #fff;
}

/* ANIMACIÓN FLUIDA AL CENTRO */
.video-item:hover .play-icon,
.video-principal:hover .play-icon{
  top:50%;
  left:50%;
  transform:translate(-50%, -50%) scale(2.4);
  background:rgba(255,255,255,0.75);
}

/* ============================================================
   MODAL DE VÍDEO
============================================================ */
#videoModal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,0.8);
  display:none;
  justify-content:center;
  align-items:center;
  z-index:9999;
}

#videoModal iframe{
  width:90vw;
  max-width:900px;
  aspect-ratio:16/9;
  border:0;
  border-radius:12px;
}

/* BOTÓN CERRAR — FIJO ESQUINA SUPERIOR DERECHA */
#videoModalClose{
  position:fixed;
  top:20px;
  right:20px;
  font-size:28px;
  color:#fff;
  cursor:pointer;
  z-index:99999;
  background:rgba(0,0,0,0.4);
  padding:6px 12px;
  border-radius:8px;
  transition:background 0.3s ease;
}

#videoModalClose:hover{
  background:rgba(255,255,255,0.2);
}

/* ============================================================
   CONTENEDOR INTERIOR DEL MODAL — CENTRADO PERFECTO
============================================================ */
.video-modal-inner{
  position:relative;
  width:90vw;
  max-width:900px;
  aspect-ratio:16/9;
  display:flex;
  justify-content:center;
  align-items:center;
}

#videoModal iframe{
  width:100%;
  height:100%;
  border:0;
  border-radius:12px;
}

/* BLUR DEL FONDO CUANDO EL MODAL ESTÁ ACTIVO */
body.modal-open {
  filter: blur(8px);
  transition: filter 0.3s ease;
}

/* CAPA DE BLUR DETRÁS DEL MODAL */
#videoModalBlur{
  position:absolute;
  inset:0;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  background: rgba(0,0,0,0.4);
  z-index:1;
}

/* CONTENEDOR DEL VÍDEO + BOTÓN CERRAR */
.video-modal-content{
  position:relative;
  z-index:2;
  width:90vw;
  max-width:900px;
  aspect-ratio:16/9;
  display:flex;
  justify-content:center;
  align-items:center;
}

/* CONTENEDOR INTERIOR DEL VÍDEO */
.video-modal-inner{
  width:100%;
  height:100%;
  border-radius:12px;
  overflow:hidden;
}

.video-modal-inner iframe{
  width:100%;
  height:100%;
  border:0;
}

/* BOTÓN CERRAR EN LA ESQUINA SUPERIOR DERECHA DEL RECUADRO */
#videoModalClose{
  position:absolute;
  top:10px;
  right:10px;
  font-size:24px;
  color:#fff;
  cursor:pointer;
  z-index:3;
  background:rgba(0,0,0,0.5);
  padding:4px 10px;
  border-radius:999px;
  line-height:1;
  transition:background 0.3s ease, transform 0.2s ease;
}

#videoModalClose:hover{
  background:rgba(255,255,255,0.2);
  transform:scale(1.05);
}

/* ============================================================
   FIX — EVITAR QUE EL OPTIMIZADOR AFECTE A LOS MODALES
============================================================ */

.galeria-modal,
#videoModal {
  position: fixed !important;
  transform: none !important;
}

body.page-ready {
  transform: none !important;
}

//* ============================================================
   SECCIÓN MÚSICA — LISTA SPOTIFY
============================================================ */

.spotify-list{
  display:flex;
  flex-direction:column;
  gap:20px;
  margin-top:30px;
}

.spotify-card{
  background:rgba(255,255,255,0.03);
  border-radius:14px;
  padding:10px;
  box-sizing:border-box;
}

.spotify-card iframe{
  display:block;
  width:100%;
  border:0;
  border-radius:10px;
}

/* Opcional: en pantallas grandes, dos columnas */
@media(min-width:900px){
  .spotify-list{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
  }
}

/* ============================================================
   SECCIÓN CONTRATAR — FORMULARIO + CONFIRMACIÓN
============================================================ */

.contratar-wrap{
  max-width:900px;
  margin:40px auto;
  padding:0 20px;
}

.contratar-title{
  font-size:26px;
  color:var(--gold);
  margin-bottom:10px;
}

.contratar-text{
  font-size:16px;
  color:var(--text);
  margin-bottom:20px;
  line-height:1.7;
}

/* ===== FORMULARIO ===== */
