<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#08152f">
  <link rel="preload" as="image" href="https://i.postimg.cc/J7drPcSV/Gold-Label-Music-transp.png">
  <title>Gold Label Music</title>
  <style>
    :root {
      color-scheme: dark;
      --navy: #08152f;
      --gold: #ffc107;
      --sky: #5485c7;
      --white: #f7f7f8;
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body {
      min-width: 320px;
      min-height: 100%;
      /* No mostrar el antiguo fondo azul durante la carga del vídeo. */
      background: #000;
      color: var(--white);
      font-family: Arial, "Segoe UI", sans-serif;
    }
    .pantalla {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      min-height: 100svh;
      overflow: hidden;
      isolation: isolate;
      background: #000;
    }
    .fondo-video, .velo, .interfaz {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .fondo-video {
      z-index: 0;
      object-fit: cover;
      object-position: 50% 50%;
      background: transparent;
    }
    .velo {
      z-index: 2;
      pointer-events: none;
      background:
        linear-gradient(180deg, rgba(8,21,47,0) 42%, rgba(8,21,47,.1) 58%, rgba(8,21,47,.34) 76%, rgba(8,21,47,.62) 100%),
        radial-gradient(ellipse at 50% 47%, transparent 24%, rgba(8,21,47,.22) 100%);
    }

    /* Cambia esta URL cuando Gold Label Music tenga su video definitivo. */
    .fondo-video { object-position: center center; }

    .interfaz {
      z-index: 3;
      display: grid;
      align-items: stretch;
      justify-items: center;
      padding: 18px max(28px, env(safe-area-inset-right)) max(22px, env(safe-area-inset-bottom)) max(28px, env(safe-area-inset-left));
      opacity: 1;
      animation: none;
    }
    .logo-navegacion {
      position: absolute;
      z-index: 4;
      top: max(22px, env(safe-area-inset-top));
      left: max(30px, env(safe-area-inset-left));
      width: clamp(88px, 9vw, 124px);
      height: auto;
      object-fit: contain;
      opacity: .9;
      filter: drop-shadow(0 2px 14px rgba(0,0,0,.44));
      pointer-events: none;
      user-select: none;
    }
    .menu-panel {
      width: min(1360px, 100%);
      height: 100%;
      display: grid;
      grid-template-rows: minmax(0, 1fr) auto auto;
      justify-items: center;
      align-items: start;
    }
    .marca-titulo {
      grid-row: 2;
      align-self: end;
      display: grid;
      justify-items: center;
      gap: clamp(10px, 1.5vh, 16px);
      margin-bottom: clamp(14px, 2vh, 20px);
    }
    .llamada {
      max-width: min(1000px, 92vw);
      margin: 0;
      color: rgba(255,255,255,.96);
      font-family: Georgia, "Times New Roman", serif;
      font-size: clamp(30px, 4.05vw, 52px);
      font-weight: 500;
      font-style: italic;
      letter-spacing: -.035em;
      line-height: 1.08;
      text-align: center;
      text-wrap: balance;
      text-shadow: 0 2px 22px rgba(0,0,0,.68);
    }
    .llamada span {
      color: var(--gold);
      font-weight: 500;
      text-shadow: 0 0 22px rgba(255,193,7,.32);
    }
    .accesos {
      grid-row: 3;
      align-self: end;
      margin-bottom: clamp(4px, 3vh, 30px);
      width: fit-content;
      max-width: 100%;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 3px;
      padding: 5px;
      border: 1px solid rgba(208,229,255,.34);
      border-radius: 999px;
      background: linear-gradient(105deg, rgba(7,16,35,.56), rgba(16,35,61,.44), rgba(7,16,35,.56));
      -webkit-backdrop-filter: blur(18px) saturate(135%);
      backdrop-filter: blur(18px) saturate(135%);
      box-shadow: 0 14px 44px rgba(0,0,0,.25), inset 0 1px 0 rgba(255,255,255,.12), 0 0 28px rgba(69,180,255,.06);
    }
    /* Para añadir o quitar accesos, duplica o elimina un enlace .acceso.
       La barra se redistribuye automáticamente en cada pantalla. */
    .acceso {
      --accent: var(--sky);
      position: relative;
      min-width: 0;
      min-height: 42px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 clamp(13px, 1.35vw, 19px);
      overflow: hidden;
      border: 1px solid transparent;
      border-radius: 999px;
      background: transparent;
      color: rgba(255,255,255,.96);
      font-size: clamp(12px, .9vw, 14px);
      font-weight: 600;
      letter-spacing: .005em;
      text-decoration: none;
      text-shadow: 0 1px 9px rgba(0,0,0,.45);
      transition: border-color .25s ease, background .25s ease, color .25s ease, transform .25s ease;
    }
    .acceso::before {
      width: 5px;
      height: 5px;
      flex: 0 0 5px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px color-mix(in srgb, var(--accent), transparent 30%);
      content: "";
      transition: box-shadow .25s ease, transform .25s ease, background .25s ease;
    }
    .acceso::after {
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: radial-gradient(ellipse at 50% 120%, rgba(80,191,255,.18), rgba(255,193,7,.11) 35%, transparent 68%);
      opacity: 0;
      content: "";
      pointer-events: none;
      transition: opacity .25s ease;
    }
    .acceso:hover, .acceso:focus-visible {
      transform: translateY(-1px);
      border-color: rgba(116,205,255,.38);
      background: rgba(74,151,210,.15);
      box-shadow: 0 0 18px rgba(74,177,255,.13), inset 0 0 14px rgba(255,193,7,.045);
      outline: none;
    }
    .acceso:hover::before, .acceso:focus-visible::before {
      transform: scale(1.24);
      box-shadow: 0 0 14px color-mix(in srgb, var(--accent), transparent 8%);
    }
    .acceso:hover::after, .acceso:focus-visible::after { opacity: 1; }
    .acceso:focus-visible { outline: 2px solid var(--gold); outline-offset: 4px; }
    .acceso.inicio { --accent: var(--gold); }
    .acceso.on-air { --accent: var(--gold); }
    .acceso:not(.inicio):not(.on-air) { --accent: #72d9ff; }
    .flecha {
      color: rgba(255,255,255,.55);
      font-size: 16px;
      font-weight: 400;
      transition: color .25s ease, transform .25s ease;
    }
    .acceso:hover .flecha, .acceso:focus-visible .flecha { color: var(--gold); transform: translate(2px,-2px); }

    @media (max-width: 760px) {
      .interfaz {
        padding: 18px max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
      }
      .menu-panel { gap: 0; transform: none; }
      .logo-navegacion {
        top: max(14px, env(safe-area-inset-top));
        left: max(16px, env(safe-area-inset-left));
        width: clamp(68px, 19vw, 92px);
      }
      .llamada { width: min(90vw, 560px); font-size: clamp(28px, 7.6vw, 40px); }
      .accesos {
        width: min(520px, 100%);
        grid-template-columns: repeat(2, minmax(0, 1fr));
        display: grid;
        gap: 3px;
        padding: 5px;
        border-radius: 22px;
      }
      .acceso { min-height: 42px; padding-inline: 10px; font-size: clamp(11px, 3.2vw, 13px); }
      .acceso:last-child { grid-column: 1 / -1; justify-self: center; width: min(68%, 220px); }
      .flecha { font-size: 13px; }
      .velo {
        background:
          linear-gradient(180deg, rgba(8,21,47,0) 36%, rgba(8,21,47,.12) 58%, rgba(8,21,47,.38) 78%, rgba(8,21,47,.7) 100%),
          radial-gradient(ellipse at 50% 44%, transparent 23%, rgba(8,21,47,.17) 100%);
      }
    }
    @media (min-width: 761px) and (max-width: 980px) {
      .llamada { font-size: clamp(34px, 4.4vw, 46px); }
      .accesos {
        width: fit-content;
        max-width: min(820px, 100%);
        display: flex;
        flex-wrap: wrap;
        border-radius: 999px;
      }
    }
    @media (max-width: 370px) {
      .llamada { font-size: 27px; }
      .acceso { min-height: 40px; padding-inline: 7px; font-size: 10px; letter-spacing: 0; }
    }
    @media (max-height: 500px) {
      .llamada { margin-bottom: 8px; font-size: clamp(21px, 5vh, 28px); }
      .accesos { margin-bottom: 4px; }
      .acceso { min-height: 36px; }
    }
    @media (prefers-reduced-motion: reduce) {
      .interfaz { opacity: 1; animation: none; }
      .acceso { transition: none; }
    }
  </style>
</head>
<body>
  <main class="pantalla">
    <video class="fondo-video" autoplay muted loop playsinline preload="auto" aria-hidden="true">
      <source src="https://res.cloudinary.com/bcfph9h2/video/upload/v1794828385/videoapertura.mp4" type="video/mp4">
    </video>
    <div class="velo" aria-hidden="true"></div>
    <img class="logo-navegacion" src="https://i.postimg.cc/J7drPcSV/Gold-Label-Music-transp.png" alt="Gold Label Music">

    <nav class="interfaz" aria-label="Accesos de Gold Label Music">
      <div class="menu-panel">
        <div class="marca-titulo">
          <h1 class="llamada">Impulsa tu carrera<br>musical con <span>glm</span></h1>
        </div>
        <div class="accesos">
          <a target="_parent" class="acceso inicio" href="https://www.goldlabelmusic.com/inicio" aria-current="page"><span>Inicio</span><span class="flecha" aria-hidden="true">↗</span></a>
          <a target="_parent" class="acceso" href="https://www.goldlabelmusic.com/inicio"><span>Distribución</span><span class="flecha" aria-hidden="true">↗</span></a>
          <a target="_parent" class="acceso" href="https://www.goldlabelmusic.com/inicio"><span>Promoción</span><span class="flecha" aria-hidden="true">↗</span></a>
          <a target="_parent" class="acceso" href="https://www.goldlabelmusic.com/inicio"><span>Branding</span><span class="flecha" aria-hidden="true">↗</span></a>
          <a target="_parent" class="acceso" href="https://www.goldlabelmusic.com/booking"><span>Booking</span><span class="flecha" aria-hidden="true">↗</span></a>
          <a target="_parent" class="acceso" href="https://www.goldlabelmusic.com/radio"><span>Radio</span><span class="flecha" aria-hidden="true">↗</span></a>
          <a target="_parent" class="acceso on-air" href="https://www.goldlabelmusic.com/glm-on-air"><span>glm On Air</span><span class="flecha" aria-hidden="true">↗</span></a>
        </div>
      </div>
    </nav>

  </main>

</body>
</html>
